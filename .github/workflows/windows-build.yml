name: Windows build

# Har bir push'da Windows'da: typecheck → lint → unit test → build → E2E → installer (.exe)
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Kodni olish
        uses: actions/checkout@v4

      - name: Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Paketlarni o'rnatish
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit testlar
        run: npm test

      - name: Build
        run: npm run build

      - name: E2E testlar (haqiqiy Electron oynasi, Windows)
        run: npm run test:e2e

      - name: Windows installer (.exe)
        run: npx electron-builder --win --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Installer'ni yuklab olish uchun saqlash
        uses: actions/upload-artifact@v4
        with:
          name: MARIUS-Setup-windows
          path: dist/MARIUS-Setup-*.exe
          if-no-files-found: error
          retention-days: 14

      - name: E2E xatolik skrinshotlari
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-test-results
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
