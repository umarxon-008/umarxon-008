appId: uz.marius.app
productName: MARIUS
copyright: Copyright © 2026 MARIUS

directories:
  output: dist
  buildResources: build

files:
  - out/**
  - package.json
  - '!**/*.map'

# node:sqlite Electron ichida tayyor, native modul yo'q, shuning uchun rebuild kerak emas.
npmRebuild: false

# Tray va bildirishnoma ikonasi
extraResources:
  - from: build/icon.png
    to: icon.png
asar: true

win:
  target:
    - target: nsis
      arch: [x64]
  icon: build/icon.png
  artifactName: MARIUS-Setup-${version}.${ext}

nsis:
  oneClick: false
  perMachine: false
  allowElevation: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: MARIUS
  uninstallDisplayName: MARIUS
  # Foydalanuvchi ma'lumotlari (%APPDATA%\MARIUS): o'chirishda so'raladi (build/installer.nsh),
  # standart javob va jim rejim — saqlash. Yangilanishda hech qachon o'chirilmaydi.
  deleteAppDataOnUninstall: false
  include: build/installer.nsh
  runAfterFinish: true

publish: null
